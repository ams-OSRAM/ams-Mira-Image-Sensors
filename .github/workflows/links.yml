name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, to catch links that break later
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check links in the Markdown pages
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: markdown
          output: lychee/report.md
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}"
            --max-retries 3
            --accept 200,206,429
            --exclude "^https?://(www\.)?raspberrypi\.com"
            --exclude "^https?://(www\.)?digikey\.com"
            "./**/*.md"
      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        run: |
          cat lychee/report.md >> "$GITHUB_STEP_SUMMARY"
          # One annotation per broken link, so it shows up on the run page.
          grep -E '^\* \[' lychee/report.md | while read -r line; do
            echo "::error title=Broken link::$line"
          done
          exit 1
